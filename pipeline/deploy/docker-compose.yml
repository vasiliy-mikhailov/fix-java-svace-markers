# ONE SERVICE. `docker compose up -d` starts one container and that is the whole deployment.
#
# The prove runs IN the pipeline process (fsm.runner.mode=local, the default) rather than behind a
# socket, and that is deliberate: a separate prover costs an ADDRESS, written in three places (an
# FSM_RUNNER_URL line here, a ${FSM_RUNNER_URL:…} placeholder in application.yml, and a compiled-in
# constant behind both), none of them read until a marker is proved. A wrong value anywhere in that
# chain surfaces hours into a 6-26 hour run as a connect retried three times and filed as an
# infrastructure failure — which reads as a prover that is down rather than as a name nothing serves.
# In the default shape that class of bug cannot be configured at all.
#
# THE SPLIT SHAPE IS STILL AVAILABLE. Set FSM_RUNNER_MODE=http and point FSM_RUNNER_URL at a runner of
# your own. That is a real thing to want — a container boundary between the pipeline's credentials and
# the build scripts under test is stronger than the denylist in tech.mikhailov.fsm.runner.Proc, which is
# what protects them inside one process.
#
# WHAT ONE PROCESS HAS TO KEEP, and each of these is pinned by orchestrator's DeploymentTest:
#   * /run_test serialised around ONE workspace per repository. Two provers share no lock at all, so a
#     second one patches the tree the first is building in — a green prove about the wrong code.
#     tech.mikhailov.fsm.runner.LocalRunner owns the single FIFO build thread; nothing else may.
#   * the build cache on a VOLUME, not a container layer. Unmounted, every `up -d` throws away every
#     checkout and every target/ behind it: minutes per repository, silently, over 282 markers.
#   * the process unprivileged and owning that cache. It runs arbitrary build scripts.
#
# NO EXTERNAL NETWORKS, AND KEEP IT THAT WAY. An `external: true` network is a name that exists on one
# machine; anywhere else `docker compose up -d` dies on its first line with "network mvn-cache declared
# as external, but could not be found", before a single container is created — a hard blocker for every
# reader, arriving after a build that succeeded. A host that needs one keeps it in
# docker-compose.override.yml, which Compose merges automatically and which is gitignored; copy
# docker-compose.override.yml.example.
#
# Compose project name, stated rather than derived. WITHOUT this line Compose takes the project from the
# directory basename, so two stacks whose deploy directories happen to share a basename resolve the same
# <basename>_default network and silently share one bridge. The line stays regardless of what this
# directory is called next, and the volumes below are additionally pinned by physical name — see the
# bottom.
name: fsm

services:
  # THE PIPELINE. The schedule, the single-flight queue, the two tables, the run history, the dashboard,
  # the five model calls, the judgement engine as a library — AND the prover: git, five JDKs and Maven,
  # cloning and building the repositories under analysis.
  #
  #   docker compose up -d --build      # Central; works on a fresh clone, anywhere
  #
  # The image is big (five JDKs) and the cold build is long. DOCKER.md has the two alternatives —
  # `docker save`/`docker load`, and a registry.
  fsm:
    build:
      # THE REACTOR ROOT. `orchestrator` depends on `engine` AND on `runner` and resolves both FROM THE
      # REACTOR — nothing publishes those jars to a repository — so a context of ../orchestrator cannot
      # build this image at all, and says so several minutes in as an unresolvable dependency.
      context: ..
      dockerfile: Dockerfile
      args:
        # Build-time only: which mirror the image's OWN Maven build resolves through. It is NOT the one
        # the proves use — see MAVEN_MIRROR_URL under environment, which is the runtime setting and the
        # one that matters. `docker compose build` cannot join a custom network, so a mirror that lives
        # on one needs the legacy builder; DOCKER.md has that command.
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: fsm:latest
    container_name: fsm
    restart: unless-stopped
    ports:
      # Loopback only. The dashboard has no authentication of its own; publish it wider by putting a
      # reverse proxy with auth in front (see docker-compose.override.yml.example) rather than by
      # changing this line. The published port is also what makes
      # `curl -XPOST localhost:8085/api/prove/marker` work from an SSH session.
      - "127.0.0.1:8085:8085"
    environment:
      # WHERE THE DATABASE LIVES, and this line must never be dropped. The default in application.yml is
      # `./data/fsm`, relative to the working directory — which in a container is a writable layer
      # discarded with the container. A run is 282 markers and 6-26 hours; losing it is SILENT, because
      # the service starts, serves, accepts an ingest and simply reads zero after the next `up -d`.
      - FSM_DB_PATH=/state/fsm
      - FSM_PORT=8085
      # WHERE THE CHECKOUTS AND BUILD WORKSPACES GO. Same argument as FSM_DB_PATH: application.yml
      # defaults it to ./data/cache, which is laptop-correct and a container's writable layer. The
      # volume below is mounted here; DeploymentTest pins the two to each other rather than to a literal.
      - CACHE=/cache
      # WHICH REPOSITORY MAVEN RESOLVES FROM, AT RUN TIME, and never a settings.xml baked into the
      # image. mirrorOf=* is not a cache in front of Central; it is the ONLY repository Maven will talk
      # to. Baked in, the container starts on any machine, answers /healthz, clones — and then fails
      # every build in hundreds of lines about unresolvable artifacts wherever that hostname does not
      # resolve, which reads as a broken project.
      #
      #   unset (the default)  -> Maven Central. Works on a laptop with nothing but Docker.
      #   MAVEN_MIRROR_URL=…   -> that URL, whatever host it names, e.g.
      #                           https://nexus.example.com/repository/maven-public/
      #
      # It is read on the way up and written to a settings.xml on the cache volume, which every `mvn`
      # is then given with -s. RUN TIME, not build time: the Guild will run an image they did not build,
      # pointed at a Nexus of their own. A compose-internal name like nexus:8081 only resolves inside
      # one Docker network, which is exactly why it cannot be the default.
      - MAVEN_MIRROR_URL=${MAVEN_MIRROR_URL:-}
      # WHERE THE PROVE RUNS. `local` is the default and the whole point of this file; `http` posts it to
      # FSM_RUNNER_URL instead, for a deployment that keeps the build sandbox in its own container.
      - FSM_RUNNER_MODE=${FSM_RUNNER_MODE:-local}
      # …AND THE ADDRESS HAS TO TRAVEL WITH THE MODE. Compose passes a variable to the process ONLY if
      # it is listed here; a name set in the shell or in .env otherwise reaches Compose's own
      # interpolation and stops there. So with the mode listed and the address not,
      #
      #     FSM_RUNNER_MODE=http FSM_RUNNER_URL=http://your-runner:8090 docker compose up -d
      #
      # — the command README.md and DOCKER.md both print — switches the mode and SILENTLY DROPS the
      # address, leaving HttpRunnerClient.DEFAULT_BASE_URL to answer for it. Every prove then goes to a
      # name nothing in this stack serves, and surfaces hours into a 6-26 hour run as a connect retried
      # three times and filed as an infrastructure failure. Both lines stay, or neither does.
      #
      # THE DEFAULT IS EMPTY, not an address, and that is the other half. An address written here would
      # be a knob that changes nothing in the `local` shape and would be believed by the next reader —
      # which is why the previous revision left the line out altogether. Empty resolves to blank, and
      # BOTH halves of the http shape agree on blank: HttpRunnerClient and HttpSourceReader each fall
      # back to the same DEFAULT_BASE_URL, so the source window and the prove cannot end up pointed at
      # two different runners. DeploymentTest pins the pair — mode and address are pass-through together
      # or neither is.
      - FSM_RUNNER_URL=${FSM_RUNNER_URL:-}
      # secrets — read straight from the process environment by tech.mikhailov.fsm.orch.Secrets, never
      # from application.yml. Unset ones are named in a WARN line on the way up rather than guessed at,
      # and that line is worth reading: this pipeline fails CLOSED, so a missing model endpoint produces
      # a green run in which every marker settles with a downgraded verdict nobody made.
      #
      # GITHUB_TOKEN is the clone credential. It never reaches a command line or a config file:
      # Workspace hands it to git through a credential helper in the environment, so it is not written
      # into any checkout's .git/config — which is what stops it outliving a rotation on the cache
      # volume. Proc strips it — and QWEN_API_KEY, SVACE_TOKEN and FSM_DB_PASSWORD — out of the
      # environment of every build this process starts.
      - QWEN_BASE_URL=${QWEN_BASE_URL}
      - QWEN_API_KEY=${QWEN_API_KEY}
      - QWEN_MODEL=${QWEN_MODEL}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      # Optional: with no Svace endpoint, Verdict argues from the code instead of failing.
      - SVACE_BASE_URL=${SVACE_BASE_URL:-}
      - SVACE_TOKEN=${SVACE_TOKEN:-}
      # The prove schedule. Set FSM_PROVE_SCHEDULE=false to run this as a REST-only orchestrator, which
      # is what you want while debugging one marker.
      - FSM_PROVE_SCHEDULE=${FSM_PROVE_SCHEDULE:-true}
      # ONE dedup_key to prove on the way up and nothing else. Empty in every normal deployment; see
      # orchestrator/README.md, "Prove one marker".
      - FSM_PROVE_MARKER=${FSM_PROVE_MARKER:-}
      # WHETHER A MARKER THAT WILL NOT REPRODUCE IS ARGUED. `true` everywhere; set it to false only
      # while tuning the reproducer's or the fixer's prompt, where the rebuttal is an unbounded model
      # call per marker arguing against prompts that are about to change again. It skips the CALL, not
      # the stage: every marker still settles, carrying bugs.verdict_status='skipped' and a `[skipped]`
      # note. Re-queue them with
      #   UPDATE suspicions SET status='new' WHERE note LIKE '[skipped]%';
      - FSM_PROVE_VERDICT=${FSM_PROVE_VERDICT:-true}
      # THE FIVE STAGE PROMPTS, and this line is what makes them tunable without a rebuild. /data is the
      # repository root, mounted read-only below — the same mount the CSV ingest reads — so /data/prompts
      # IS the repo's own prompts/ directory. Editing prompts/verdict.txt in the worktree and restarting
      # this container is the whole loop. A file that is present wins; DEFAULT_<STAGE>_PROMPT in the
      # environment is the fallback; the text compiled into the class is what a deployment with neither
      # gets. All five sources are named per stage in the boot log —
      # `docker compose logs fsm | grep '\[prompts\]'` answers "is the prompt I edited the prompt it
      # sent?".
      - FSM_PROMPTS_DIR=${FSM_PROMPTS_DIR:-/data/prompts}
      # THE FEEDBACK STORE, and it is OFF. One JSON line per settled marker — the resolved prompts, the
      # raw model replies, the code in and out — appended to the repo's feedback/gepa-feedback.jsonl and
      # accumulated ACROSS RUNS. Default OFF because the completeness is also the cost: gigabytes over a
      # few runs, including source from the third-party repositories. See orchestrator/README.md.
      - FSM_FEEDBACK=${FSM_FEEDBACK:-false}
      - FSM_FEEDBACK_PATH=${FSM_FEEDBACK_PATH:-/data/feedback/gepa-feedback.jsonl}
    volumes:
      # A NAMED VOLUME, not a bind mount. It holds a live H2 store — every settled verdict, every
      # marker's evidence, every drafted PR body — and a bind mount would put that inside the git
      # worktree that is mounted read-only below.
      - fsm-orchestrator-state:/state
      # THE CLONES AND THE BUILD WORKSPACES, at the path CACHE names above. A named volume, not a bind
      # mount: a couple of dozen third-party repositories, each with its target/, do not belong in a git
      # worktree. Unmounted, /cache is the container's writable layer and every `up -d` re-clones
      # everything and loses every target/ the second build of each repository depends on.
      #
      # NEVER POINT THIS AT A CACHE VOLUME SOMETHING ELSE WROTE. This code ADOPTS an existing checkout
      # rather than re-cloning it, and adoption never rewrites remote.origin.url — so a checkout cloned
      # from `https://<token>@github.com/…` by anything else carries that token verbatim in its
      # .git/config and this service keeps using it, past a rotation of GITHUB_TOKEN. Nothing here
      # writes such a URL: Workspace hands the token to git through a one-shot credential helper that
      # leaves nothing on disk.
      - fsm-runner-cache:/cache
      # repo root, read-only, so an ingest can read /data/data/svace/*.csv. `csv_path` is resolved in
      # THIS container. It is also where /data/prompts comes from.
      - ../../:/data:ro
      # THE ONE WRITABLE PATH INSIDE THE REPOSITORY, and it is ONE DIRECTORY rather than the repo.
      #
      # The feedback store (off by default) appends to /data/feedback/gepa-feedback.jsonl, which is the
      # repo's own feedback/ directory — where a prompt-tuning pass will look. The mount above is `:ro`,
      # so without this line the feature works on a laptop and silently no-ops here, one WARN per marker
      # into a log nobody is reading during a 26-hour run.
      #
      # A SECOND BIND OVER ONE SUBDIRECTORY, not `:rw` on the line above. This service clones and patches
      # THIRD-PARTY code and runs Maven over it; making the whole worktree writable would put the
      # engine's source, the prompts, this file and .git itself inside the blast radius. Docker layers
      # this mount over the read-only one, so `touch /data/x` still fails inside the container.
      #
      # IT MUST BE WRITABLE BY UID 10002, the `fsm` user the image runs as. A bind mount carries the
      # HOST's ownership, so an unprepared directory is root-owned and the store cannot write to it.
      # `feedback/.gitkeep` is committed so a clone has the directory; the deployment step is one line:
      #     sudo chown 10002:10002 feedback
      # The store probes this on the way up and says so with an ERROR naming the fix, rather than
      # discovering it 40 markers in.
      - ../../feedback:/data/feedback

  # THE DEBUGGING ROUTE, AND IT IS OFF. Not started by `docker compose up -d`; start it by name:
  #
  #   docker compose --profile engine up -d engine
  #   curl -s -XPOST localhost:8092/node/verdict -H 'Content-Type: application/json' -d @request.json
  #
  # WHY IT IS KEPT AT ALL. The orchestrator embeds the same judgement code as a LIBRARY — nothing in a
  # run ever calls this service, and FSM_ENGINE_URL is read by nothing — but this is the only way to
  # reproduce ONE stage against a request written by hand, instead of a 6-26 hour run around it. See
  # engine/src/main/java/.../NodeRoutes.java for the paths and the request contract.
  #
  # WHY IT IS BEHIND A PROFILE rather than deleted (which loses the route) or left running (which makes
  # "one command, one container" false and hands a reader a service nothing calls).
  #
  # IT HOLDS NO SECRETS, and that is worth keeping: the model endpoint, the Svace endpoint and the
  # GitHub token all arrive IN THE REQUEST, so there is one source of truth for them — the caller's.
  engine:
    profiles: ["engine"]
    build:
      context: ../engine
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    image: fsm-engine:latest
    container_name: fsm-engine
    restart: unless-stopped
    ports:
      # Loopback, and published on purpose: reaching it by hand IS what this service is for.
      - "127.0.0.1:8092:8092"
    environment:
      - PORT=8092
    volumes:
      # `Parse markers` reads the Svace report off the mounted repo: `csv_path` is resolved inside this
      # container. Read-only — the engine only ever reads a request and writes a reply.
      - ../../:/data:ro

# EVERY volume below pins its PHYSICAL name explicitly, and that is what makes renaming this project
# safe. Without `name:`, Compose derives the real volume as <project>_<key> — so today's store is
# `fsm_fsm-orchestrator-state`, and the project name becomes load-bearing data-retention config.
# Changing `name: fsm` at the top would then make Compose look for a volume that does not exist, CREATE
# IT EMPTY, and start a healthy-looking service serving an empty backlog: schema.sql recreates the
# tables, so nothing errors and nothing is red. That is how 8 hours of validated run history would
# disappear with no signal at all.
#
# The names below are the ones LIVE on the deployment host. Treat them as data, not as labels: changing
# one is the same act as pointing the stack at a different, empty volume.
volumes:
  # The clones and the build workspaces.
  fsm-runner-cache:
    name: fsm_fsm-runner-cache
  # THE one that must not move. 282 markers, every settled verdict, every drafted PR body, for a run
  # that takes 6-26 hours. It survives `docker compose up -d --build`, which is the entire point. To
  # throw a run away deliberately: `docker compose down && docker volume rm fsm_fsm-orchestrator-state`.
  fsm-orchestrator-state:
    name: fsm_fsm-orchestrator-state
