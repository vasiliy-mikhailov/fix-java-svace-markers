spring:
  application:
    name: fsm-orchestrator

  datasource:
    # H2 ON DISK, and this is the single most consequential line in the file.
    #
    # A run is 282 markers and 6-26 hours. An in-memory database would mean that any restart — a
    # deploy, an OOM, a host reboot — silently discards every settled verdict and every marker still
    # queued, and the only symptom is a dashboard that reads zero. On disk, a restart costs the one
    # marker that was mid-prove and nothing else.
    #
    # FSM_DB_PATH must point at a MOUNTED VOLUME when this runs in a container. The default below is
    # relative to the working directory, which inside an image is a writable layer that is thrown away
    # with the container — correct for a developer running `mvn spring-boot:run`, and a data-loss bug
    # if it is left unset in compose. Set it to something under the volume, e.g. /data/fsm.
    #
    # NO SERVER SETTING ON THIS LINE, AND THAT IS THE FIX FOR A MEASURED EXPOSURE.
    #
    # It used to end `;AUTO_SERVER=TRUE`. What that buys is genuine: a second process may open the same
    # file while the orchestrator holds it, so a developer can point a SQL client at a RUNNING
    # orchestrator and ask why marker X is still 'new' without stopping the run to find out. Without it
    # H2 takes an exclusive lock and the only way to read the table is to kill the thing you are
    # debugging.
    #
    # What it ALSO does is start a TCP server with -tcpAllowOthers (H2's own Database.startServer), on
    # the WILDCARD address. On 2026-07-29 lsof showed this process listening on *:50159 — IPv6 wildcard,
    # not loopback-bound — and data/fsm.lock.db advertised the port to anything that could read the
    # directory. Reachable as 'sa' with an EMPTY password, read AND WRITE, in front of 282 markers,
    # their evidence and their drafted PR bodies. No debugging convenience is worth that.
    #
    # SO: OFF BY DEFAULT, with the route kept as an opt-in that carries two conditions. Set
    #     FSM_DB_AUTO_SERVER=true   AND   FSM_DB_PASSWORD=<something>
    # and the setting is appended to the URL below, in the ${fsm.db.server-settings:} slot. Ask for the
    # server WITHOUT a password and the process REFUSES TO START, because 'sa' plus an empty password
    # over TCP is not a debugging route, it is an unauthenticated write endpoint. And whenever the
    # server is on at all it is pinned to 127.0.0.1 (h2.bindAddress), so it is not reachable off the
    # host even with the password: get in with
    #     ssh -L 9092:127.0.0.1:<port> <host>
    # where <port> is AUTO_SERVER_PORT if you set one, and otherwise the `server=` line inside
    # <db>.lock.db.
    #
    # All three rules live in tech.mikhailov.fsm.orch.H2Exposure, which reads the RESOLVED url — so
    # typing AUTO_SERVER=TRUE back onto this line does not get past it either.
    url: "jdbc:h2:file:${FSM_DB_PATH:./data/fsm}${fsm.db.server-settings:}"
    driver-class-name: org.h2.Driver
    username: "${FSM_DB_USER:sa}"
    # Empty by default, which is only safe because nothing listens by default. The guard above is what
    # keeps those two facts tied to each other.
    password: "${FSM_DB_PASSWORD:}"
    hikari:
      # The prover is single-flight by design (one workspace in the java-runner), but the web layer,
      # the websocket push and the reconciliation all read concurrently. Small and bounded.
      maximum-pool-size: 8
      pool-name: fsm-pool

  sql:
    init:
      # Replayed on EVERY start, which is safe only because schema.sql is CREATE ... IF NOT EXISTS
      # throughout. See the header of that file.
      mode: always
      schema-locations: classpath:schema.sql
      # Loud. A schema script that half-applied and was ignored is how a column goes missing for a
      # week; the process must refuse to start instead.
      continue-on-error: false

  batch:
    jdbc:
      # Boot creates BATCH_JOB_* if they are absent and leaves them alone if they are not. Same
      # database as the markers on purpose: a job execution and the rows it moved are one story.
      initialize-schema: always
    job:
      # OFF, and this is not a preference. Boot's JobLauncherApplicationRunner runs every Job bean in
      # the context on start-up, with whatever parameters it can build — which here would run `ingest`
      # with no CSV and no repo on every restart. The ingest step CLEARS both tables before it parses,
      # so a deploy would wipe a 26-hour backlog and then fail on the missing `repo`. (The tasklet's
      # transaction would roll that clear back, but relying on it to survive a deploy is not a plan.)
      # Both jobs are started deliberately: by the schedule below or by POST /api/prove, /api/ingest.
      enabled: false

  h2:
    console:
      # Off by default — this is a service, not a shell. There is no authentication in front of it and
      # it executes arbitrary SQL, so turning it on publishes a write shell on the same port as the
      # dashboard. The supported way in is the guarded, loopback-pinned AUTO_SERVER opt-in above.
      enabled: ${FSM_H2_CONSOLE:false}
      path: /h2

server:
  port: ${FSM_PORT:8085}

# THE HEALTH ENDPOINTS, and the reason there are two.
#
# /healthz answers a machine — a container restart policy, a Caddy `health_uri` — in plain text, because
# that is what dashboard/src/server.js answered and whatever polls it has no JSON parser. It used to
# return a hardcoded 200 'ok': it answered 'ok' on every request through a run in which every prove was
# failing on a refused connection, so nothing wired to it could ever have fired. It now runs a real
# query; see DashboardController#healthz and DatabaseHealth.
#
# /actuator/health answers the operator who wants to know WHICH component is down, and aggregates the
# same probe alongside Boot's own. Details are OFF by default: there is no authentication in front of
# this port, and the details include the database product, its version and the failure text. Set
# FSM_HEALTH_DETAILS=always on a host where the port is not reachable from anywhere you do not trust.
management:
  endpoints:
    web:
      exposure:
        # health only. Nothing here needs /actuator/env, /actuator/configprops or /actuator/beans, and
        # each of them is a description of this deployment served to anyone who asks.
        include: health
  endpoint:
    health:
      show-details: ${FSM_HEALTH_DETAILS:never}

# WHERE THE THREE CLIENTS POINT AND WHAT THEY WAIT FOR. Deployment topology, readable by anyone.
#
# EXACTLY ONE @ConfigurationProperties CLASS BINDS THE `fsm` PREFIX —
# tech.mikhailov.fsm.orch.config.FsmProperties — and each key it binds names its reader in that class's
# javadoc. Two classes used to claim the prefix with different shapes for `fsm.runner`, so each binder
# silently dropped the other's keys and five of the settings below reached nothing at all.
# FsmPropertiesTest fails the build if a second claimant ever appears, and sets every bound key to a
# non-default value to prove it arrives at the object that acts on it.
#
# The keys that are NOT bound by it are the ones no record can serve: `fsm.db.auto-server` (read before
# the context exists), `fsm.prove.schedule-*` and `fsm.live.*` (consumed by @ConditionalOnProperty,
# @Scheduled and @Value, which take a ${...} placeholder). Each of those is documented where it is read,
# because a second declaration of one knob is the same defect in a tidier shape.
#
# NO CREDENTIAL IS EVER ADDED TO THIS FILE. QWEN_BASE_URL, QWEN_API_KEY, QWEN_MODEL, GITHUB_TOKEN,
# SVACE_BASE_URL and SVACE_TOKEN are read straight from the process environment by
# tech.mikhailov.fsm.orch.Secrets, which deliberately does NOT go through Spring's Environment — so a
# key added here would not bind, and a secret cannot arrive in the repository by being pasted into the
# wrong file.
fsm:
  db:
    # THE ONLY WAY TO OPEN A DATABASE PORT ON THIS PROCESS, and it is off. Read by
    # tech.mikhailov.fsm.orch.H2Exposure — deliberately straight off the Environment rather than
    # through FsmProperties, because the guard runs before the application context exists and so
    # before any @ConfigurationProperties class has been bound.
    #
    # Turning it on costs FSM_DB_PASSWORD as well; without one the process refuses to start. Read the
    # long comment on spring.datasource.url above before you set it. `fsm.db.server-settings` is the
    # slot in that URL and is owned by the guard: it is not set here, and setting it here would be
    # overridden.
    auto-server: ${FSM_DB_AUTO_SERVER:false}
  runner:
    # fsm-runner on the compose default network. It clones, builds RED, applies the fix and builds
    # GREEN, one marker at a time around a single cached workspace.
    #
    # THIS DEFAULT SAID `fsm-java-runner` FOR A WHILE AFTER THAT CONTAINER WAS DELETED, which is worth
    # a line because nothing catches it: the address is written here, in n8n/docker-compose.yml as the
    # FSM_RUNNER_URL passthrough, and in HttpRunnerClient.DEFAULT_BASE_URL as the last fallback — and
    # none of the three is read until a marker is actually proved. The stack starts, /healthz is green,
    # the schedule fires, and six hours in the first prove spends three connect attempts on a name
    # nothing serves and is filed as an infrastructure failure. DeploymentTest pins all three together
    # and pins this one to a service that exists in the compose file.
    base-url: ${FSM_RUNNER_URL:http://fsm-runner:8090}
    # ISO-8601, and the ONLY knob for this number — the prove chain passes it to every /run_test call
    # and the client uses it as its own default. 90 minutes = clone + two Maven builds at the runner's
    # own 20-minute ceiling each, the same number the n8n node used (5400000 ms). Lowering it does not
    # fail safely: the request is abandoned while a build that was going to succeed is still running,
    # and the marker is requeued having burnt the shared workspace for nothing.
    timeout: ${FSM_RUNNER_TIMEOUT:PT90M}
    # The CONNECT only, and that is the whole point. A connection that was never established means the
    # runner never saw the request, so nothing is running twice — which is what makes it safe to repeat
    # when compose has just started both containers. Any failure PAST the connect is reported once:
    # a second POST would be another clone plus two builds on top of the ones already going.
    connect-attempts: ${FSM_RUNNER_CONNECT_ATTEMPTS:3}
    connect-retry-delay-ms: ${FSM_RUNNER_CONNECT_RETRY_MS:3000}
  github:
    # Only an enterprise install or a test moves this. It reaches BOTH callers of the contents API —
    # the source fetch and Prep prover's default-branch lookup.
    api-base-url: ${FSM_GITHUB_API:https://api.github.com}
    # The three settings the n8n `Fetch source` node carried: options.timeout, retryOnFail/maxTries and
    # waitBetweenTries. A rate limit or a single 502 must not cost a marker its place in the queue; a
    # 401/403/404 is never retried, because none of those changes in three seconds.
    timeout-ms: ${FSM_GITHUB_TIMEOUT_MS:60000}
    attempts: ${FSM_GITHUB_ATTEMPTS:3}
    retry-delay-ms: ${FSM_GITHUB_RETRY_MS:3000}
  prompts:
    # WHERE THE FIVE STAGE PROMPTS ARE READ FROM, and the reason they are not in .env any more.
    #
    # A prompt is SOURCE — diffable, reviewable, versioned beside the code that sends it, and above all
    # TUNABLE, because a feedback store is being built alongside this pipeline so that recurring
    # complaints can be folded back into these five texts. None of that works for a string compiled into
    # a class file, which is where all five of them were.
    #
    # THE RULE, PER STAGE: <dir>/<stage>.txt wins; DEFAULT_<STAGE>_PROMPT in the environment is the
    # fallback; the text compiled into the class is what a deployment with neither gets. Per stage and
    # not per directory, so dropping in one file tunes one stage and leaves the other four alone.
    #
    # The default is THE MOUNT. docker-compose.yml binds the repository root to /data read-only for this
    # service — the same mount the CSV ingest already reads — so /data/prompts is the repo's own
    # prompts/ directory seen from inside the container. Dropping a file in there changes what the model
    # is told with no rebuild and no image; :ro is fine, nothing here writes.
    #
    # A directory that is not there is NOT an error: every stage falls back and the process behaves
    # exactly as it did before this key existed. What it is, is a WARNING on the way up — along with one
    # INFO line per stage naming its source — because a prompt that silently fell back and a prompt that
    # was picked up produce identical rows, identical verdicts and identical run histories. See
    # tech.mikhailov.fsm.orch.PromptSource.
    dir: ${FSM_PROMPTS_DIR:/data/prompts}
  llm:
    # The transport budget for a COMPLETION — the reproducer and the fixer, which have no fallback.
    # Two, because a completion is the most expensive call in the pipeline and the failure this is for
    # (a front end that dropped the connection while the model loaded) is answered by one more try or
    # not at all. An endpoint that ANSWERED is never retried, and neither is a completion that ran out
    # of clock: that request was delivered, and the model may have spent the whole hour on it.
    attempts: ${FSM_LLM_ATTEMPTS:2}
    retry-delay-ms: ${FSM_LLM_RETRY_MS:3000}
  prove:
    # THE SCHEDULE, replacing the n8n Schedule Trigger's 60-second interval. It is not a throughput
    # knob — a prove takes minutes and the job drains the queue itself — it only decides how long an
    # idle orchestrator waits before noticing a fresh backlog, and how long a marker that came back
    # through the infra path waits before its next attempt. Fixed DELAY, measured from the end of the
    # tick; overlapping runs are prevented by the launcher, not by the interval.
    schedule-enabled: ${FSM_PROVE_SCHEDULE:true}
    schedule-delay: ${FSM_PROVE_INTERVAL:PT60S}
    # Long enough that an operator can see the process came up healthy before it claims a marker.
    schedule-initial-delay: ${FSM_PROVE_INITIAL_DELAY:PT30S}
    # ONE dedup_key to prove on the way up, and nothing else — the debugging route, empty in every
    # deployment. It is a FLAG, not a setting: it exists so that "marker X settles wrong, reproduce it"
    # is one command instead of a re-ingest and a wait for the drain to reach X. Pair it with
    # FSM_PROVE_SCHEDULE=false, or the tick 30 seconds later starts a drain behind the marker being
    # examined. See orchestrator/README.md, "Prove one marker".
    marker: ${FSM_PROVE_MARKER:}
    # VERDICT_MIN_ATTEMPTS from gen-prover.js. How many reproducer samples a non-reproduction is worth
    # before it is written up as a verdict; one sample is a weak basis for "this marker is wrong", and
    # the engine refuses to guess the number.
    min-attempts: ${FSM_PROVE_MIN_ATTEMPTS:2}
    # WHETHER A MARKER THAT WILL NOT REPRODUCE IS ARGUED. ON everywhere, and OFF is for iterating on the
    # EARLIER prompts, where a rebuttal written against a reproducer prompt that is about to change
    # again is dead weight.
    #
    # WHAT IT SKIPS IS THE ARGUMENT, NOT THE STAGE, and the difference is the whole safety of it. The
    # verdict stage also routes every state to a suspicion_status, decides the retry, composes the
    # verdicts for markers settled BY EXECUTION and carries the anchor onto the row — none of which
    # costs a call, and a marker whose status is never computed sits in `new` for ever. So OFF skips
    # exactly the model call, on exactly the three routes that make one: not_reproduced, not-a-bug, and
    # the exhausted-build hatch. The other five settle identically either way.
    #
    # WHAT IT COSTS, precisely: those three routes lose their rebuttal, and with it the state rewrite to
    # false_positive / by_design / unprovable. They retire as `rejected` (or `infra_stuck` for the
    # hatch, which keeps its composed fallback), with `bugs.verdict_status = 'skipped'` and a note
    # starting `[skipped]` — never the `[gap]` label, which has to keep meaning "a state the verdict
    # stage does not route". To argue them afterwards, put the markers back on the queue:
    #     UPDATE suspicions SET status = 'new' WHERE note LIKE '[skipped]%';
    verdict-enabled: ${FSM_PROVE_VERDICT:true}
    # 0 drains the whole queue in one execution. 1 is exactly what the n8n schedule did — one marker
    # per tick — which over a 282-marker report wastes a minute of wall clock per marker.
    max-markers-per-run: ${FSM_PROVE_MAX_MARKERS:0}
    # The wall clock for one /run_test lives at `fsm.runner.timeout` above and NOWHERE ELSE. It used to
    # be restated here as `run-test-timeout` and wired to the same environment variable, which is fine
    # until somebody sets one of them: then two documented knobs disagree about one number and the
    # client's default silently wins for any call that names none.
    #
    # How many markers may fail on INFRASTRUCTURE before the execution gives up. Not zero, or one 502
    # would end a 26-hour drain; not unbounded, or an outage would walk the whole backlog releasing
    # markers as fast as connections are refused. At this limit a systemic outage ends the run in
    # seconds — the job goes FAILED, which the dashboard paints red — and the next tick starts clean.
    # A skipped marker keeps prove_attempts unchanged, so nothing is spent by being skipped.
    #
    # This number is ALSO the line between "scattered failures" and "an outage" for max-infra-strikes
    # below: a marker is only charged with an infra failure by an execution that stayed inside this
    # budget. See tech.mikhailov.fsm.orch.batch.ClaimReleaseListener#afterStep.
    skip-limit: ${FSM_PROVE_SKIP_LIMIT:25}
    # How many proves IN A ROW may fail before the question was ever asked — GitHub unreachable, the
    # runner refusing connections for this repo, the model endpoint down — before the marker is parked
    # as `infra_stuck` and stops occupying the queue.
    #
    # THIS IS NOT prove_attempts, AND THE DIFFERENCE IS THE POINT. prove_attempts counts attempts that
    # reached the engine and got an answer, however bad; an InfraFailure reaches nothing, so it must
    # never spend one, or a dead endpoint ends up looking like three considered judgements about code
    # nobody read. The streak is counted in its own table (`infra_strikes`), a marker that reaches ANY
    # verdict clears it, and parking writes no bugs row and no verdict — only a status that means
    # "never became testable" and a note saying so. 0 retries for ever.
    max-infra-strikes: ${FSM_PROVE_MAX_INFRA_STRIKES:3}
  feedback:
    # THE CRITIQUE STORE — one JSON line per settled marker, appended to the SAME file across runs.
    #
    # OFF BY DEFAULT, and that is the setting rather than a preference. Every record holds the resolved
    # prompt and the raw reply of all five model calls plus the source file they were shown; the
    # completeness is the entire point of the file (a prompt cannot be improved from a score) and it is
    # also why a normal production run must not start accumulating it silently. Turn it on deliberately.
    #
    # WHAT IS IN IT, IN ONE SENTENCE: full prompts, full model replies, and source excerpts from the
    # third-party repositories under analysis. It is gitignored — for the same reason the H2 store is —
    # and the file's own first line says so, because a warning that lives only in a README is a warning
    # nobody holding the file ever reads.
    #
    # AND THIS SWITCH IS ALSO WHAT THE DASHBOARD'S "Team guidance" PANEL READS. `CritiqueIndex` takes
    # its enabled flag from the STORE rather than from this property a second time, so the panel can
    # never claim recording is on while the writer is off. With it false the panel says so in words and
    # names this variable — it does NOT render an empty list, which would read as "no problems found"
    # about a pipeline nobody ever asked.
    enabled: ${FSM_FEEDBACK:false}
    # THE FILE, not its directory, and ABSOLUTE for the reason FSM_DB_PATH is: a relative path inside a
    # container resolves against a writable layer that is discarded with the container, so the feature
    # would appear to work and lose everything on the next `docker compose up -d`.
    #
    # /data is the repository root, bound READ-ONLY for this service. /data/feedback is a SECOND bind
    # over that one directory, read-write — see n8n/docker-compose.yml, which explains why the whole
    # repo is not made writable for a service that clones and patches third-party code. So this path is
    # the repo's own feedback/ directory, which is where a prompt-tuning pass will look for it.
    path: ${FSM_FEEDBACK_PATH:/data/feedback/gepa-feedback.jsonl}
  comments:
    # THE HUMAN CHANNEL'S DURABLE COPY — one appended event per comment somebody writes on the
    # dashboard, in a file BESIDE the harvested critiques above.
    #
    # ON BY DEFAULT, which is the opposite of fsm.feedback.enabled and for the opposite reason. That
    # store is off because it accumulates gigabytes of prompts, replies and third-party source. This one
    # holds short sentences typed by a person, and the only other place they live is the H2 file under
    # FSM_DB_PATH — which a cold start destroys, and which is exactly how every earlier run's data went.
    # A durability guarantee that must be switched on is one that will be off on the deployment where it
    # matters.
    #
    # OFF DOES NOT DISABLE COMMENTS. They are still accepted, still stored in H2, still served. What is
    # given up is the copy that survives a redeploy — and every write says so in its own response body
    # (`stored.journal`), so it can never be given up silently.
    enabled: ${FSM_COMMENTS_JOURNAL:true}
    # A SEPARATE FILE FROM gepa-feedback.jsonl, in the SAME writable bind. Same durability, same mount,
    # no new deployment step. Separate because CritiqueIndex folds every line of the feedback file that
    # carries a dedup_key into its counts: comments in there would inflate the "N recorded prove(s)"
    # headline and mix hand-typed opinions into totals whose value is that they were computed the same
    # way every time.
    path: ${FSM_COMMENTS_PATH:/data/feedback/human-comments.jsonl}
  live:
    # The dashboard's live push. `watch-ms` is how often the backlog is scanned for status changes —
    # the observation that stamps `marker_progress` and feeds the STOMP topics. It is a projection of
    # two narrow columns against a local database, not a network call, so two seconds is cheap; the knob
    # exists for a deployment on a slow disk.
    #
    # Switching this OFF costs the retry/settled-only split on the Effort panel, because nothing else
    # writes `marker_progress` — every verdict, every artifact and every count is unaffected. The test
    # profile below does exactly that: a watcher stamping observations underneath a test that asserts on
    # them is a race, not a feature.
    enabled: ${FSM_LIVE:true}
    watch-ms: ${FSM_LIVE_WATCH_MS:2000}
    # How often a message goes out on /topic/progress even when nothing has changed. It is the client's
    # staleness signal: STOMP heart-beats are negotiated off (the page has nothing to answer them with),
    # so without this a half-open socket is indistinguishable from a quiet run and the tab silently
    # stops updating. Sent only while a browser is actually attached.
    tick-ms: ${FSM_LIVE_TICK_MS:5000}

logging:
  level:
    tech.mikhailov.fsm: INFO

---
# TEST PROFILE ONLY. Never a default and never a fallback: if this were reachable in production the
# failure would be invisible — the service would start, serve, accept an ingest, and lose all of it on
# the next restart with nothing in the log to say so.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    # DB_CLOSE_DELAY=-1 keeps the database alive between the connections a Spring test context opens
    # and closes; without it the schema vanishes with the first returned connection.
    url: "jdbc:h2:mem:fsm;DB_CLOSE_DELAY=-1"
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
fsm:
  comments:
    # UNDER target/, not /data. The journal is ON by default — deliberately, see above — and the default
    # path is a container mount that does not exist on a developer's machine, so a test run would log an
    # ERROR per context and write nothing. Pointing it at the module's own build directory keeps the
    # two-store write path REAL under test (the file is created, appended and fsynced) without leaving
    # anything outside target/. A test that asserts on the file's contents uses its own @TempDir.
    path: ./target/test-comments/human-comments.jsonl
  live:
    # OFF under test. The watcher writes `marker_progress` whenever it sees a status change, and a test
    # that inserts markers and then asserts on the effort model would be racing a background thread
    # stamping observations against the rows it just wrote. LiveWatcherTest drives the watcher directly
    # instead, which is also the only way to assert what the FIRST pass does.
    enabled: false
  prove:
    # OFF for the same reason, and with worse consequences if it were not: a scheduled tick would
    # CLAIM markers a test had just inserted and run the whole prove chain against them — real HTTP,
    # to a runner and a model that are not there. Every test that wants a prove launches one itself.
    schedule-enabled: false
